# Continuous integration: runs on every pull request and on pushes to the long-lived branches.
# Each step mirrors a command from CLAUDE.md, so a red check can be reproduced locally.
#
# Actions are pinned to their major version to keep this file readable. A production project
# may prefer pinning each action to a full commit SHA, kept up to date by Dependabot.
name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

# The workflow only reads the code.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from "packageManager" in package.json.
      # It must come before setup-node, which needs pnpm for its cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: pnpm protocol:check
      - name: Type check
        run: pnpm --filter protocol typecheck
      - name: Generator and schema tests
        run: pnpm --filter protocol test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # Gradle runs on this JDK and compiles with it: the build asks for the Java 25 toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # Caches Gradle and checks that gradle-wrapper.jar is the official one.
      # "basic" is the open source (MIT) cache provider, built on actions/cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compile with NullAway and run the tests
        run: ./gradlew test
      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/*/build/reports/tests/test/
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # These scripts are placeholders until the client is set up; the job is ready for them.
      - name: Lint
        run: pnpm --filter open-iso-world-client lint
      - name: Unit tests
        run: pnpm --filter open-iso-world-client test
      - name: Build
        run: pnpm --filter open-iso-world-client build
